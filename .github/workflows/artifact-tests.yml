name: Installed artifact tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operator-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
        artifact: [wheel, sdist]
        bounds: [latest]
        include:
          - python: "3.12"
            artifact: wheel
            bounds: minimum
          - python: "3.12"
            artifact: sdist
            bounds: minimum
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_tasks_aws_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/django_tasks_aws_test
      REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/checkout-example
        env:
          EXAMPLE_REPOSITORY: ${{ vars.EXAMPLE_REPOSITORY || 'sharingan-no-kakashi/django-aws-tasks-example' }}
          EXAMPLE_REF: ${{ vars.EXAMPLE_REF || 'main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --all-groups
      - run: uv build --no-sources
      - run: uv run --group browser playwright install --with-deps chromium
      - run: uv python install ${{ matrix.python }}
      - name: Verify installed distribution and browser
        env:
          VERIFY_PYTHON: ${{ matrix.python }}
          VERIFY_BOUNDS: ${{ matrix.bounds }}
        run: uv run --group browser pytest tests/artifact/test_install.py::test_installed_${{ matrix.artifact }}_migrations_commands_and_browser --junitxml=artifacts/artifact-gate.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installed-operator-evidence-${{ matrix.python }}-${{ matrix.artifact }}-${{ matrix.bounds }}
          path: artifacts/*.xml

