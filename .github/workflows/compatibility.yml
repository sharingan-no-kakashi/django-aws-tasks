name: Database compatibility matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.database.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python: ["3.12", "3.13", "3.14"]
        database:
          - label: PostgreSQL 15
            engine: postgres
            image: postgres:15
            port: "5432"
            user: postgres
            name: django_tasks_aws_test
            health: pg_isready -U postgres
            extra: postgres
          - label: PostgreSQL 16
            engine: postgres
            image: postgres:16
            port: "5432"
            user: postgres
            name: django_tasks_aws_test
            health: pg_isready -U postgres
            extra: postgres
          - label: MySQL 8.4
            engine: mysql
            image: mysql:8.4
            port: "3306"
            user: root
            name: mysql
            health: mysqladmin ping -h 127.0.0.1 -prootpassword
            extra: mysql
          - label: MariaDB 10.6
            engine: mariadb
            image: mariadb:10.6
            port: "3306"
            user: root
            name: mysql
            health: healthcheck.sh --connect --innodb_initialized
            extra: mariadb
          - label: Oracle 23
            engine: oracle
            image: gvenzl/oracle-free:23-slim-faststart
            port: "1521"
            user: system
            name: 127.0.0.1:1521/FREEPDB1
            health: healthcheck.sh
            extra: oracle
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: rootpassword
          POSTGRES_DB: django_tasks_aws_test
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_ROOT_HOST: "%"
          MARIADB_ROOT_PASSWORD: rootpassword
          MARIADB_ROOT_HOST: "%"
          ORACLE_PASSWORD: rootpassword
          TZ: UTC
        ports:
          - ${{ matrix.database.port }}:${{ matrix.database.port }}
        options: >-
          --health-cmd "${{ matrix.database.health }}"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      TEST_DATABASE: ${{ matrix.database.engine }}
      TEST_DB_NAME: ${{ matrix.database.name }}
      TEST_DB_USER: ${{ matrix.database.user }}
      TEST_DB_PASSWORD: rootpassword
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: ${{ matrix.database.port }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install MySQL-family driver build dependencies
        if: matrix.database.engine == 'mysql' || matrix.database.engine == 'mariadb'
        run: sudo apt-get update && sudo apt-get install -y libmariadb-dev libmariadb-dev-compat pkg-config
      - run: uv sync --locked --group dev --extra ${{ matrix.database.extra }}
      - name: Select Oracle Easy Connect DSN
        if: matrix.database.engine == 'oracle'
        run: |
          echo 'TEST_DB_HOST=' >> "$GITHUB_ENV"
          echo 'TEST_DB_PORT=' >> "$GITHUB_ENV"
      - run: make test-unit PYTEST_ARGS="-ra --junitxml=artifacts/unit.xml"
        env:
          UV_NO_SYNC: "1"
      - run: make test-compatibility PYTEST_ARGS="-ra --junitxml=artifacts/compatibility.xml"
        env:
          UV_NO_SYNC: "1"
      - name: Database logs
        if: failure()
        run: docker logs "${{ job.services.database.id }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: compatibility-${{ matrix.python }}-${{ matrix.database.engine }}-${{ matrix.database.port }}-${{ strategy.job-index }}
          path: artifacts/*.xml
