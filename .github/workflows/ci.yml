name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check src tests scripts
      - run: uv run ruff check src tests scripts
      - run: uv run mypy
      - run: uv run python scripts/check_traceability.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: make audit

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --group dev
      - run: make test-unit PYTEST_ARGS="-ra --junitxml=artifacts/unit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-test-evidence
          path: artifacts/unit.xml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv build
      - name: Inspect wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "django_tasks_aws/__init__.py" in names, names
          assert any("django_task_aws/prototype" in n for n in names) is False
          # no editable/workspace path references may leak into the artifact
          assert all("../django-aws-tasks-example" not in n for n in names)
          print(f"wheel ok: {wheel}")
          PY

  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"
      - run: terraform -chdir=terraform/modules/task_observability fmt -check -recursive
      - run: terraform -chdir=terraform/modules/task_observability init -backend=false -lockfile=readonly
      - run: terraform -chdir=terraform/modules/task_observability validate
      - run: terraform -chdir=terraform/modules/task_observability test

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_TERRAFORM_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/checkout-example
        env:
          EXAMPLE_REPOSITORY: ${{ vars.EXAMPLE_REPOSITORY || 'sharingan-no-kakashi/django-aws-tasks-example' }}
          EXAMPLE_REF: ${{ vars.EXAMPLE_REF || 'main' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false
      - run: uv sync --locked --all-groups
      - run: terraform fmt -check -recursive terraform
      - run: terraform fmt -check -recursive ../django-aws-tasks-example/terraform
      - run: uv run pytest tests/terraform -ra --junitxml=artifacts/terraform.xml
      - run: terraform -chdir=../django-aws-tasks-example/terraform/bootstrap init -backend=false -lockfile=readonly
      - run: terraform -chdir=../django-aws-tasks-example/terraform/bootstrap validate
      - run: terraform -chdir=../django-aws-tasks-example/terraform/application init -backend=false -lockfile=readonly
      - run: terraform -chdir=../django-aws-tasks-example/terraform/application validate
      - run: terraform -chdir=../django-aws-tasks-example/terraform/bootstrap test
      - run: terraform -chdir=../django-aws-tasks-example/terraform/application test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: infrastructure-test-evidence
          path: artifacts/terraform.xml

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked --group docs
      - run: make docs

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -shellcheck=""

  required:
    name: CI required
    if: always()
    needs: [lint, security, test, build, monitoring, infrastructure, docs, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS" | jq -e 'all(. == "success")'
