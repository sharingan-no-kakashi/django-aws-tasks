# Traceability matrix: stable requirement IDs to tests and evidence.
# Generated at DT-001. Every design invariant, transition, worker response
# outcome, and section-18 failure-matrix row receives a stable ID. `test_id`
# is filled as executable tests land; `null` means the requirement is defined
# but not yet implemented.
version: 1
workflow_version: 1
status: partially_implemented

requirements:
